apiVersion: v1
kind: Secret
metadata:
  name: rms-secrets
type: Opaque
stringData:
  # In a real production environment, these would be encrypted using a tool like SOPS or AWS Secrets Manager.
  # For this project, we define them directly for simplicity.
  DATABASE_URL: "postgresql://user:password@host/database"
  JWT_SECRET: "your_highly_secure_jwt_secret_key"
  NODE_ENV: "production"
