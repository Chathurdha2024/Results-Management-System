---
# 1. BACKEND API DEPLOYMENT & SERVICE
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
  labels:
    app: backend-api
spec:
  replicas: 3 # Auto-scaled to 3 instances for High Availability
  selector:
    matchLabels:
      app: backend-api
  template:
    metadata:
      labels:
        app: backend-api
    spec:
      containers:
      - name: backend-api
        image: engrms/backend:latest
        ports:
        - containerPort: 3000
        envFrom:
        - secretRef:
            name: rms-secrets
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  type: ClusterIP
  selector:
    app: backend-api
  ports:
  - port: 3000
    targetPort: 3000

---
# 2. STUDENT PORTAL DEPLOYMENT & SERVICE
apiVersion: apps/v1
kind: Deployment
metadata:
  name: student-frontend
  labels:
    app: student-frontend
spec:
  replicas: 5 # Higher replicas for Student Portal due to high traffic volume
  selector:
    matchLabels:
      app: student-frontend
  template:
    metadata:
      labels:
        app: student-frontend
    spec:
      containers:
      - name: student-frontend
        image: engrms/student-frontend:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: student-frontend-service
spec:
  type: ClusterIP
  selector:
    app: student-frontend
  ports:
  - port: 80
    targetPort: 80

---
# 3. ADMIN PORTAL DEPLOYMENT & SERVICE
apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin-frontend
  labels:
    app: admin-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: admin-frontend
  template:
    metadata:
      labels:
        app: admin-frontend
    spec:
      containers:
      - name: admin-frontend
        image: engrms/admin-frontend:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: admin-frontend-service
spec:
  type: ClusterIP
  selector:
    app: admin-frontend
  ports:
  - port: 80
    targetPort: 80
